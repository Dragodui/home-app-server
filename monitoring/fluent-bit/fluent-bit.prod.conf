[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name              forward
    Listen            0.0.0.0
    Port              24224

[FILTER]
    Name              parser
    Match             *
    Key_Name          log
    Parser            app_json
    Reserve_Data      On

[OUTPUT]
    Name            opensearch
    Match           home-app.api
    Host            opensearch
    Port            9200
    Index           home-app-logs
    Suppress_Type_Name On
    Replace_Dots    On
    tls             On
    tls.verify      Off
    HTTP_User       admin
    HTTP_Passwd     ${ADMIN_PASSWORD}
